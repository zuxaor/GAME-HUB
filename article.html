<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article | GAME HUB</title><meta name="description" content="Article dynamique de GAME HUB."><meta name="robots" content="index,follow"><link rel="canonical" href="https://example.github.io/game-hub/"><meta property="og:title" content="Article | GAME HUB"><meta property="og:description" content="Article dynamique de GAME HUB."><meta property="og:type" content="website"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/animations.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">GAME<span>HUB</span></a><nav class="nav-links" aria-label="Navigation principale"><a href="index.html">Accueil</a><a href="jeux.html">Jeux</a><a href="actualites.html">Actualités</a><a href="sorties.html">Sorties</a><a href="esport.html">Esport</a></nav><div class="nav-actions"><button class="icon-btn" data-search aria-label="Ouvrir la recherche">⌕</button><button class="menu-btn" aria-label="Ouvrir le menu">☰</button></div></div></header><main class="container article" data-article><div class="empty">Chargement de l'article...</div></main><script>window.addEventListener('gh:ready',()=>{const root=document.querySelector('[data-article]');const a=GH.article(GH.params().get('id'));if(!a){root.innerHTML='<div class="empty"><h2>Article introuvable</h2><a class="btn btn-primary" href="actualites.html">Retour aux actualités</a></div>';return}const g=GH.game(a.game);document.title=`${a.title} | GAME HUB`;document.querySelector('meta[name="description"]')?.setAttribute('content',a.excerpt);const content=a.content.map(x=>x.type==='paragraph'?`<p>${GH.esc(x.text)}</p>`:x.type==='subtitle'?`<h2>${GH.esc(x.text)}</h2>`:x.type==='quote'?`<blockquote>${GH.esc(x.text)}</blockquote>`:x.type==='list'?`<ul>${x.items.map(i=>`<li>${GH.esc(i)}</li>`).join('')}</ul>`:'').join('');const similar=GH.news.filter(n=>n.id!==a.id&&(n.game===a.game||n.category===a.category)).slice(0,3);root.innerHTML=`<header class="article-header"><div class="eyebrow"><span class="pill">${GH.esc(a.category)}</span><span>${GH.esc(g?.name||a.game)}</span><span>•</span><span>${GH.formatDate(a.date)}</span></div><h1>${GH.esc(a.title)}</h1><p class="article-lead">${GH.esc(a.excerpt)}</p><div class="meta">Par ${GH.esc(a.author)} • ${GH.esc(a.readingTime)}</div><img src="${GH.esc(a.image)}" alt="${GH.esc(a.title)}" style="width:100%;aspect-ratio:16/8;object-fit:cover;border-radius:20px;margin-top:28px"></header><div class="article-content">${content}</div><section class="section"><div class="section-head"><h2 class="section-title">Articles similaires</h2></div><div class="grid news-grid">${similar.map(GH.cardNews).join('')}</div></section>`;GH.observe()});</script><footer class="site-footer"><div class="container footer-grid"><div><div class="logo">GAME<span>HUB</span></div><p>Toute l'actualité gaming au même endroit.</p><small>© 2026 Game Hub</small></div><div><div class="footer-title">Navigation</div><div class="footer-links"><a href="index.html">Accueil</a><a href="jeux.html">Jeux</a><a href="actualites.html">Actualités</a><a href="sorties.html">Sorties</a><a href="esport.html">Esport</a><a href="recherche.html">Recherche</a></div></div><div><div class="footer-title">Informations</div><div class="footer-links"><a href="mentions-legales.html">Mentions légales</a><a href="confidentialite.html">Politique de confidentialité</a></div></div></div></footer><script src="js/app.js"></script><script src="js/games.js"></script><script src="js/news.js"></script><script src="js/search.js"></script><script src="js/filters.js"></script><script src="js/game-page.js"></script></body></html>
